<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claims Processor &mdash; Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #f4f6fb; }
        .brand-bar { background: linear-gradient(90deg, #0d6efd, #6610f2); color: #fff; }
        .upload-card { max-width: 720px; margin: 3rem auto; box-shadow: 0 8px 24px rgba(0,0,0,.08); border: none; }
        .drop-zone { border: 2px dashed #adb5bd; border-radius: .5rem; padding: 2rem; text-align: center; cursor: pointer; transition: .15s; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #0d6efd; background: #eef4ff; }
        .footer { color: #6c757d; font-size: .85rem; text-align: center; margin: 2rem 0 1rem; }
    </style>
</head>
<body>

<nav class="brand-bar py-3 mb-3 shadow-sm">
    <div class="container d-flex align-items-center">
        <i class="bi bi-shield-plus fs-3 me-2"></i>
        <h4 class="mb-0">Claims Processor &mdash; ABC Health Insurance</h4>
    </div>
</nav>

<div class="container">
    <div class="card upload-card">
        <div class="card-body p-4">
            <h5 class="card-title mb-1"><i class="bi bi-cloud-arrow-up me-2"></i>Upload claims CSV</h5>
            <p class="text-muted">Pick a transactions CSV (same schema as the sample) to process all three coverage modes.</p>

            <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div th:text="${error}"></div>
            </div>

            <form method="post" th:action="@{/process}" enctype="multipart/form-data" id="upload-form">
                <label class="drop-zone d-block" for="file-input">
                    <i class="bi bi-filetype-csv display-4 text-primary"></i>
                    <div class="mt-2 fw-semibold">Click to choose a CSV file</div>
                    <div class="text-muted small">or drag &amp; drop it here</div>
                    <div id="file-name" class="mt-2 small text-success"></div>
                </label>
                <input class="d-none" type="file" id="file-input" name="file" accept=".csv" required>

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-play-fill me-1"></i>Process claims
                    </button>
                </div>
            </form>

            <hr class="my-4">
            <div class="row text-center small">
                <div class="col"><i class="bi bi-percent text-primary"></i><br>Percentage after deductible</div>
                <div class="col"><i class="bi bi-shield-check text-success"></i><br>No charge</div>
                <div class="col"><i class="bi bi-currency-dollar text-warning"></i><br>Flat dollar</div>
            </div>
        </div>
    </div>

    <p class="footer">Java 25 &middot; Spring Boot &middot; Strategy pattern + DAO abstraction</p>
</div>

<script>
    const dz = document.querySelector('.drop-zone');
    const fi = document.getElementById('file-input');
    const fn = document.getElementById('file-name');
    fi.addEventListener('change', () => { fn.textContent = fi.files[0] ? fi.files[0].name : ''; });
    ['dragenter', 'dragover'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.remove('dragover'); }));
    dz.addEventListener('drop', ev => {
        if (ev.dataTransfer.files.length) {
            fi.files = ev.dataTransfer.files;
            fn.textContent = fi.files[0].name;
        }
    });
</script>
</body>
</html>
